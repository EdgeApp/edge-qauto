appId: ${MAESTRO_APP_ID}
tags:
  - all
---
- launchApp

# Nav to password login
# - runFlow:
#     when:
#       visible: Network request failed
#     commands:
#       - tapOn:
#           point: '95%,7%'
# - runFlow:
#     when:
#       visible: No Internet Connection
#     commands:
#       - tapOn:
#           point: '95%,7%'
- tapOn: 'Exit PIN'

# Check and tap "Exit PIN" again if it's still visible due to "update edge" modal
- runFlow:
    when:
      visible: 'Exit PIN'
    commands:
      - tapOn: 'Exit PIN'

# Password login

# - assertVisible: 'edge-jared'
# removed by Jared for evm test

- tapOn:
    id: 'passwordFormField'
- inputText: ${MAESTRO_PASSWORD}
- pressKey: Enter

- extendedWaitUntil:
    visible: 'Assets'
    timeout: 120000

- tapOn: 'Assets'
