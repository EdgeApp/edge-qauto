appId: ${MAESTRO_APP_ID}
tags:
  - all
---
- launchApp

# Nav to password login
- runFlow:
    when:
      notVisible: Alert
    commands:
       - tapOn: 'Exit PIN'



# Password login
- assertVisible: 'Login'
# - assertVisible: 'perf'
- tapOn:
    id: 'passwordFormField'
- inputText: ${MAESTRO_PASSWORD}
- pressKey: Enter

- extendedWaitUntil:
    visible: 'Assets'
    timeout: 120000

- tapOn: 'Assets'

# onFlowComplete:
#   - shell: afplay /System/Library/Sounds/Submarine.aiff
